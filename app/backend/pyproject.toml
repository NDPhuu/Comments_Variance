[project]
name = "vwb"
version = "0.1.0"
description = "Variance Workbench backend — glass-box budget-variance commentary (graduation thesis MVP)"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.30,<1.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "google-genai (>=2.29.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]

[project.optional-dependencies]
# Dense retrieval (BGE-M3) la tuy chon: keo theo torch (~2.5GB).
# Khong cai tren Render; cut line la BM25 + metadata filter.
dense = ["flagembedding (>=1.4.2,<2.0.0)"]

[tool.poetry]
packages = [{ include = "vwb" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
