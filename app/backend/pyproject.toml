[project]
name = "vwb"
version = "0.1.0"
description = "Variance Workbench backend — glass-box budget-variance commentary (graduation thesis MVP)"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "pyyaml (>=6.0,<7.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.30,<1.0)",
]

[tool.poetry]
packages = [{ include = "vwb" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
