services:
  - type: web
    name: vwb-api
    runtime: python
    rootDir: app/backend
    buildCommand: pip install poetry && poetry install --only main --no-root
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
